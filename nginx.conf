events {}

http {
    log_format detailed_log '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'Host:$host X-Real-IP:$remote_addr X-Forwarded-For:$http_x_forwarded_for '
                            'Request_time:$request_time';
    access_log /var/log/nginx/access.log detailed_log;

    server {
        listen 80;

        location / {
            # allow 192.168.0.100;
            # deny all;

            auth_basic "Restricted Area";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://chroma:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
